- date: 2026.09.28
  headline: "Jin Lei gives an invited talk at the 6th International Workshop on Quasi-Free Scattering with Radioactive-Ion Beams, Takayama, Japan."
  headline_zh: "金磊将在第六届放射性束准自由散射国际研讨会（日本高山）作邀请报告。"

- date: 2026.07.28
  headline: "The spectator approximation on the detected fragment is removed from the Ichimura-Austern-Vincent model, generalizing its sum rules. <a href='https://doi.org/10.1103/rbph-64rs'>Phys. Rev. C 114, 014632</a>."
  headline_zh: "Ichimura-Austern-Vincent 模型原本把被探测碎片视为不参与反应的旁观者，新工作去掉这一近似并推广求和规则。<a href='https://doi.org/10.1103/rbph-64rs'>Phys. Rev. C 114, 014632</a>。"

- date: 2026.07.16
  headline: "Hao Liu, Jin Lei and Zhongzhou Ren give an exact construction of the coupled-channel Green's function and prove it unique. <a href='https://doi.org/10.1103/6jvb-2kp2'>Phys. Rev. C 114, 014623</a>."
  headline_zh: "刘昊、金磊、任中洲严格构造耦合道格林函数，用它描述反应振幅怎样在不同通道间传播，并证明该构造唯一。<a href='https://doi.org/10.1103/6jvb-2kp2'>Phys. Rev. C 114, 014623</a>。"

- date: 2026.06.22
  headline: "PINN-ECS is published and released: exterior complex scaling makes physics-informed neural networks usable for nuclear scattering. <a href='https://doi.org/10.1103/sjz4-pq6p'>Phys. Rev. C 113, 064618</a>."
  headline_zh: "PINN-ECS 发表并开源。外部复标度把远处振荡的散射波转成衰减函数，使物理信息神经网络能够求解核散射。<a href='https://doi.org/10.1103/sjz4-pq6p'>Phys. Rev. C 113, 064618</a>。"

- date: 2026.06.16
  headline: "Jin Lei is appointed Junior Editor of Chinese Physics C."
  headline_zh: "金磊受聘为《Chinese Physics C》青年编委。"

- date: 2026.05.12
  headline: "An incoming-wave boundary condition combined with a complex potential separates true fusion from peripheral loss. <a href='https://doi.org/10.1016/j.physletb.2026.140479'>Phys. Lett. B 877, 140479</a>."
  headline_zh: "入射波边界条件只允许波进入核内区，配合复势后可把真正的熔合与靶核外围的损失分开。<a href='https://doi.org/10.1016/j.physletb.2026.140479'>Phys. Lett. B 877, 140479</a>。"

- date: 2026.04.15
  headline: "A reduced-basis emulator reproduces an 18-parameter continuum-discretized coupled-channel calculation about 220 times faster. <a href='https://doi.org/10.1103/n24x-d9gm'>Phys. Rev. C 113, 044610</a>."
  headline_zh: "降基代理从一批完整解中提取少数主要形状，以约 220 倍的速度复现 18 参数的连续离散化耦合道计算，也就是把束缚态和离散后的破裂态联立求解。<a href='https://doi.org/10.1103/n24x-d9gm'>Phys. Rev. C 113, 044610</a>。"


  info: >
    Professor, Department of Physics, Tongji University. Works on reactions induced by weakly
    bound nuclei: inclusive breakup and incomplete fusion, absorption mechanisms in coupled-channel
    theory, scattering solvers and emulators, and uncertainty quantification for optical potentials.
  info_zh: >
    同济大学物理科学与工程学院教授。研究束缚很松、碰撞时容易散开的原子核：碎片怎样被吸收，如何计算只俘获部分入射核的
    不完全熔合，以及怎样改进散射程序并判断实验数据真正约束了哪些光学势参数。

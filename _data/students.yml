- name: Jizheng Bo
  photo: bojizheng.jpg
  info: >
    PhD student. Works on applying quantum few-body methods to nuclear decay, starting from two-body
    alpha decay and moving toward multi-fragment emission in the same continuum framework used for
    breakup.
  info_zh: >
    博士生。研究把量子少体方法用于核衰变，从两体的 alpha 衰变出发，逐步走向在与破裂相同的连续态框架内处理多碎片发射。

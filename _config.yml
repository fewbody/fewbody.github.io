# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Quantum Few-Body Dynamics Group, Tongji University
email: jinl@tongji.edu.cn
description: > # this means to ignore newlines until "baseurl:"
  Nuclear reaction theory group led by Jin Lei at the Department of Physics, Tongji University.
  Inclusive breakup and incomplete fusion, absorption mechanisms in coupled-channel theory,
  scattering solvers and emulators, and uncertainty quantification for optical potentials.
baseurl: ""
url: ""

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

# Google Analytics
google_analytics: G-J60NE88WR1

<ul class="news-list">
{% for article in site.data.news %}
  <li>
    <span class="news-date">{{ article.date }}</span>
    <span class="news-text">
      <span class="l-en">{{ article.headline }}</span><span class="l-zh">{% if article.headline_zh %}{{ article.headline_zh }}{% else %}{{ article.headline }}{% endif %}</span>
    </span>
  </li>
{% endfor %}
</ul>
